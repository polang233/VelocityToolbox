# 界面语言。留空 = 自动跟随服务器系统语言，没有对应语言文件时回退中文。
# 也可填 zh_cn / en_us，或 lang/ 下自定义文件名（不要写 .yml）。
# 玩家可见消息用 MiniMessage，默认强调色 #FF6600、正文 #CCFFFF（1.16+ 客户端可显示 RGB）。
# 改完后执行 /vtoolbox reload。
language: ""

# /vtoolbox plugin load|unload|reload 管理 plugins/ 目录里的其它 Velocity 插件。

# 子服客户端版本限制。无需安装 ViaVersion。
# /vtoolbox reload 或 /velocity reload 重载规则；/vtoolbox info 查看模块状态。
server-versions:
  # 默认关闭。未列出的子服不限制，服务器名对应 velocity.toml 的 [servers]。
  enabled: false
  # min/max 含边界，省略时使用当前 Velocity 支持的最低/最高版本。
  # max: max 跟随当前 Velocity 支持的最高版本，升级代理后会更新。
  # allow 非空时只允许列表中的协议；deny 优先拒绝。范围与 allow 同时满足才放行。
  # 版本名必须加引号，也支持整数协议号，例如 340 = 1.12.2。
  # 同协议版本会一起匹配，例如 "1.20" 和 "1.20.1" 都是 763。
  # 配置重载失败保留上次有效规则；首次加载失败则拒绝子服连接，修复后重载恢复。
  servers: {}
  # 示例，启用时用实际子服名替换，并用以下内容替换上面的 servers: {}：
  # servers:
  #   lobby:
  #     min: "1.12"
  #     max: max
  #   survival:
  #     allow: ["1.12.2", "1.20.1"]
  #   minigame:
  #     min: "1.18"
  #     deny: ["1.19.1", "1.20.2"]

pack-host:
  # 是否开启资源包 HTTP 托管。关闭后不再监听端口。
  enabled: false
  # HTTP 监听网卡。0.0.0.0 表示本机所有网卡都接请求。
  # 这只是服务绑在哪，不是玩家客户端去打开的地址。
  bind: 0.0.0.0
  # HTTP 监听端口。本插件只在本机提供这个服务，不会自动映射到公网。
  # 外网要下载资源包，需自行在防火墙 / 路由器 / 云安全组 / 反代里放行该端口。
  port: 8765
  # 写进下载 URL 的来源（协议 + 主机 + 端口）。玩家客户端必须打得开这个地址。
  # 留空：自动用检测到的第一块局域网 IPv4，适合内网。
  # 外网：先把上面的 port 放到外网可访问，再填例如 http://公网IP:8765 或 https://pack.example.com
  # 不要填 127.0.0.1 / localhost（除非玩家和代理同一台电脑），也不要填 0.0.0.0。
  public-url: ""
  # 资源包 zip 目录。可以是：
  #   packs                         — 相对本插件数据目录，实际为 plugins/VelocityToolbox/packs
  #   ../OtherPlugin/packs          — 相对本插件数据目录，指到旁边另一个插件
  #   D:/resourcepacks              — Windows 绝对路径
  #   /var/www/resourcepacks        — Linux 绝对路径
  packs-directory: packs
