# 插件界面语言：zh_cn、zh_tw、en_us 或 lang/ 中的自定义文件名；留空跟随系统语言。
language: ""

# 子服客户端版本限制。
server-versions:
  enabled: false
  # 键名为 velocity.toml 中的子服名，未列出的子服不限制。
  #   min / max  包含边界，省略时跟随代理支持的范围。
  #   allow      填写后须在列表内。
  #   deny       优先排除。
  # 版本名加引号，也可填协议号。
  servers:
    survival:
      min: "1.15"
    rpg:
      min: "1.15"
      deny: ["1.19.1", "1.19.2"]
    minigame:
      allow: ["1.20.1", "1.21.1"]

# 资源包 HTTP 托管。只用外部直链时无需开启。
pack-host:
  enabled: false
  # 本机监听地址和端口；公网访问需放行防火墙或配置端口映射。
  bind: 0.0.0.0
  port: 8765
  # 玩家下载地址前缀，如 http://公网IP:8765 或 https://packs.example.com。
  # 留空自动选本机局域网地址，公网服务器请填写。
  public-url: ""
  # ZIP 目录，可填相对插件目录的路径或绝对路径。
  packs-directory: packs
  # 下载保护，默认值适合大多数服务器，整段可省略。
  security:
    # 全服 / 单 IP 同时下载数。VTB 发给在线玩家的下载不受单 IP 限制。
    max-downloads: 64
    max-downloads-per-ip: 12
    # 单 IP 每分钟请求额度。
    requests-per-minute-per-ip: 120
    # 单次下载期限（秒）。
    max-download-seconds: 60
    # 全服 / 单次下载带宽（MiB/s），0 不限速。
    bandwidth-mib: 0
    per-download-mib: 0
    # 可信 HTTP 反代的 IP/CIDR，如 ["127.0.0.1/32"]；直连或 frp 等 TCP 隧道保持为空。
    trusted-proxies: []

# 资源包选择与下发。
# 文档：https://github.com/polang233/VelocityToolbox/wiki/Resource-Packs
resource-packs:
  enabled: false
  # 默认设置。
  settings:
    # 进入子服后等待多久下发（秒）。
    delay: 3
    # 从发出请求到加载成功的期限（秒）。
    timeout: 60
    # 是否必须加载；拒绝、失败或超时会断开玩家。
    required: false
    # 客户端确认界面的提示（MiniMessage），可留空。
    prompt: "<#CCFFFF>请加载服务器资源包。"

  # 单文件直接写 包名: "@文件.zip"。
  # 按条件选择时写成列表，取首个满足条件的项，选项如下：
  #   url         必填。"@文件.zip" 取托管目录中的 ZIP；外部直链须同时填 hash。
  #   hash        外部直链 ZIP 的 40 位 SHA-1。
  #   required    可省略，默认取 settings。
  #   prompt      可省略，默认取 settings。
  #   versions    可省略，不限版本。规则同 server-versions，只选文件，不转换格式。
  #   permission  可省略，不限权限。与 versions 同时填写时须都满足。
  # 全部不匹配时跳过并提示玩家；最后写 - none 表示不下发且不提示。
  packs:
    base: "@base.zip"

    survival:
      - url: "@survival.zip"
        required: true
        prompt: "<#CCFFFF>生存服需要资源包。"
        versions:
          min: "1.20.3"
      # 旧客户端只接收一个包，应使用包含全部资源的完整包。
      - url: "@survival-legacy.zip"
        versions:
          min: "1.15"
          max: "1.20.2"
      - none

    vip:
      - url: "@vip.zip"
        permission: "velocitytoolbox.pack.vip"
        versions:
          min: "1.20.3"

    # 外部直链示例：
    # event:
    #   - url: "https://packs.example.com/event.zip"
    #     hash: "实际 ZIP 的 40 位 SHA-1"

  # 子服分配。未列出的子服使用 default，子服配置不继承 default。
  # 子服名可用 * 通配；精确名称优先，多个通配按书写顺序取第一个。
  #   [a, b]  下发这些包；1.20.3+ 按顺序叠加，后面的覆盖前面的。
  #   []      不下发，并撤下 VTB 的资源包（1.20.3+）。
  #   keep    保留已下发的包，不发新包。
  # 完整写法 keep-existing: true 加 packs：有 VTB 包就保留，没有才下发。
  servers:
    default: keep
    lobby:
      keep-existing: true
      packs: [base]
    "survival-*": [survival, vip]
    minigame: []
