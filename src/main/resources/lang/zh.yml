prefix: "<bold><#FF6600>[VTB]</bold> "

command:
  help:
    title: "<#FF6600>VelocityToolbox 命令"
    version: "<#CCFFFF>版本、插件数量、托管开关"
    status: "<#CCFFFF>代理、Java、托管来源、已加载插件"
    packs: "<#CCFFFF>列出每个 zip 的 URL 和 SHA-1"
    vhosts: "<#CCFFFF>按入口域名列出在线玩家"
    reload: "<#CCFFFF>重载语言、配置和资源包托管"
    plugin: "<#CCFFFF>插件管理（list / load / unload / reload）"
  plugin:
    title: "<#FF6600>插件管理"
    list: "<#CCFFFF>列出已加载插件"
    load: "<#CCFFFF>从 plugins/ 加载"
    unload: "<#CCFFFF>卸载"
    reload: "<#CCFFFF>卸载后再加载"
    limit: "<#CCFFFF>简单插件热卸载通常没问题。LuckPerms、协议/数据包、权限或长期占连接的大型插件即使能卸掉，也不建议热卸载；出问题请完整重启代理。"
    list-title: "<#FF6600>已加载插件 <#CCFFFF><count> 个"
  usage: "<#FF6600>用法</#FF6600>  <#CCFFFF><usage>"
  version: "<#FF6600>VelocityToolbox</#FF6600> <#CCFFFF><version>  插件数=<plugins>"
  status:
    proxy: "<#CCFFFF>代理 <version>  Java <java>  插件数=<plugins>"
    origin: "<#CCFFFF>下载来源 <#FF6600><origin>"
    packs-dir: "<#CCFFFF>资源包目录 <path>"
  packs:
    disabled: "<#FF6600>资源包托管未启用。"
    empty: "<#FF6600>目录里没有 zip：<#CCFFFF><path>"
    title: "<#FF6600>资源包 <#CCFFFF><count> 个"
  vhosts:
    title: "<#FF6600>玩家入口 <#CCFFFF><count> 人"
    empty: "<#FF6600>当前没有在线玩家。"
    unknown: "<#CCFFFF>未知"
  pack-host:
    on: "<#CCFFFF>开"
    off: "<#FF5555>关"
  reload:
    ok: "<#CCFFFF>已重载语言、配置和资源包托管。"
    fail: "<#FF5555>重载失败，请看代理日志。"

plugins:
  load:
    need-jar: "<#FF5555>需要 <dir> 下的 .jar 文件名"
    missing-file: "<#FF5555>插件 JAR 不存在：<file>"
    protected: "<#FF5555>拒绝加载受保护插件 '<plugin>'。"
    already: "<#FF5555>插件 '<plugin>' 已经加载。"
    id-taken: "<#FF5555>插件 ID '<plugin>' 已被占用。"
    missing-dep: "<#FF5555>插件 <plugin> 缺少依赖 '<dependency>'"
    ok: "<#CCFFFF>已加载插件 <plugin>。"
    fail: "<#FF5555>加载失败。"
  unload:
    protected: "<#FF5555>拒绝卸载受保护插件 '<plugin>'。"
    not-loaded: "<#FF5555>插件 '<plugin>' 未加载。"
    depended: "<#FF5555>插件 '<plugin>' 仍被依赖：<dependents>"
    ok: "<#CCFFFF>已卸载插件 <plugin>。"
    fail: "<#FF5555>卸载失败。"
  reload:
    no-jar: "<#FF5555>插件 '<plugin>' 没有 JAR 路径，无法重载。"
    load-failed: "<#FF5555>已卸载 '<plugin>'，但重新加载失败。"
    ok: "<#CCFFFF>已重载插件 <plugin>。"
  cleanup:
    summary: "<#CCFFFF>清理：命令 <commands>，任务 <tasks>，额外监听器 <listeners>，消息通道 <channels>。"
  leftover:
    still-loaded: "<#FF5555>卸载后 '<plugin>' 仍在 PluginManager 里，请看代理日志并考虑重启。"
    commands: "<#FF5555>仍有命令残留：<detail>"
    listeners: "<#FF5555>仍有事件监听残留 <count> 条，请看代理日志。"
  shutdown-error: "<#FF5555>插件关闭事件抛了异常，仍继续做卸载清理。"
  error:
    detail: "<#FF5555><type>：<message>"
    see-log: "<#CCFFFF>完整堆栈已写入代理日志，把那段异常发出来就能继续查。"

log:
  started: "VelocityToolbox <version> 已启动。资源包托管 <packhost>，插件目录 <dir>。"
  bstats-fail: "无法启动 bStats。"
  pack-fail: "资源包托管启动失败。插件管理命令仍可使用。"
  reload-fail: "无法重载语言或资源包托管。"
  list-jars: "无法列出 <dir> 里的插件 JAR。"
  loaded: "已加载插件 <plugin> <version>，来自 <file>。"
  unloaded: "已卸载插件 <plugin>。"
  load-fail: "无法加载插件 <file>。"
  unload-fail: "无法卸载插件 <plugin>。"
  rollback-fail: "回滚失败的加载 <file> 时出错。"
  commands-unregistered: "已注销插件 <plugin> 的 <count> 条命令。"
  cleanup-warn:
    events: "无法注销插件 <plugin> 的事件监听器。"
    tasks: "无法取消插件的调度任务。"
    executor: "无法关闭插件 <plugin> 的线程池。"
    classloader: "无法关闭插件类加载器。"
    leftover-handlers: "按类加载器扫出插件 <plugin> 的残留监听器 <count> 条。"
    leftover-channels: "按类加载器注销插件 <plugin> 的 <count> 条消息通道。"
