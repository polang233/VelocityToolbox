# MiniMessage 文字。請保留 <player> 等佔位符；開頭的空格用來對齊模組資訊。

# 共用文字、標點與版本格式
common:
  prefix: "<bold><#FF6600>[VTB]</bold> "
  separator: "："
  none: "無"
  unknown: "未知"
  "yes": "是"
  "no": "否"
  console: "主控台"
  enabled: "已啟用"
  disabled: "已關閉"
  usage: "<#FF6600>用法</#FF6600>  <#CCFFFF><usage>"
  versions:
    range: "<min> 至 <max>"
    allow: "；僅允許 <versions>"
    deny: "；排除 <versions>"

# 共用指令、基本資訊與啟動訊息
main:
  language:
    regenerate: "<yellow>語言檔 <file> 使用舊版結構，目前先採用內建語言。請先備份，再移走該檔案並執行 /vtb reload 重新產生；自訂語言可複製新版範本。"
  help:
    title: "<#FF6600>VToolBox 指令"
    info: "<#CCFFFF>查看外掛、代理、版本限制與資源包狀態"
    reload: "<#CCFFFF>重新載入設定、語言、版本限制與資源包"
  info:
    title: "<#FF6600>VToolBox 資訊"
    field:
      toolbox-version: "<gray>工具箱版本"
      proxy-version: "<gray>代理版本"
      java-version: "<gray>Java"
    section: "<#FFB366>基本資訊"
  reload:
    ok: "<green>設定、語言、版本限制與資源包已重新載入。"
    fail: "<#FF5555>重新載入失敗，請查看代理伺服器的記錄。"
  log:
    started: "<green>VelocityToolBox <version> 已啟動。"
    reloaded: "<green><source> 已重新載入設定、語言、版本限制與資源包。"
    reload-failed: "設定或資源包重新載入失敗 / Configuration or resource pack reload failed."

