      classloader: "无法关闭插件类加载器。"

# 子服与入口：玩家分组、版本限制与日志
server:
  title: "<#FFB366>子服与入口"
  help:
    hosts: "<#CCFFFF>按入口分组显示域名、端口、人数和玩家信息"
    summary: "<#CCFFFF>子服与入口查询"
  info:
    players: "<gray>在线玩家：<#CCFFFF><count>"
  hosts:
    title: "<#FF6600>入口统计：<#CCFFFF><entries> 个入口 / <players> 名在线玩家"
    entry: "  <gray>入口域名</gray>：<aqua><domain></aqua>  <gray>人数</gray>：<green><count></green>  <gray>端口</gray>：<aqua><port></aqua>"
    expand-hint: "<gray>点击展开该入口的玩家列表</gray>"
    collapse-hint: "<gray>点击收起该入口的玩家列表</gray>"
    player: "    <#FFB366><name></#FFB366>  <gray>延迟</gray>：<#CCFFFF><ping>"
    player-hover-title: "<#FFB366>玩家详情：<name>"
    player-uuid: "UUID"
    player-ip: "连接 IP"
    player-server: "当前子服"
    player-mode: "模式"
    invalid-entry: "<#FF5555>入口序号 <index> 不存在。"
    empty: "<#FF6600>当前没有在线玩家。"
  player:
    online-mode: "正版验证"
    offline-mode: "离线模式"
  versions:
    status:
      enabled: "<green>子服版本限制：已启用，共 <count> 个子服规则"
      rule: "    <aqua><server></aqua><gray>：<requirement>"
      disabled: "<gray>子服版本限制：已关闭"
      failed: "<red>子服版本限制：配置加载失败，暂时拒绝所有子服连接"
    denied: "<red>无法进入 <server>。<newline><yellow>版本要求：<requirement><newline><gray>你的客户端：<version>。"
    protocol-details: "<gray>协议号要求：<requirement>"
    client-protocol: "<gray>客户端协议号：<protocol>"
    unavailable: "<red>子服版本限制配置暂时不可用，请联系管理员。"
    log:
      load-failed: "子服版本配置加载失败，暂时拒绝子服连接。修复 config.yml 后重载，或关闭 server-versions。 / Version rules failed to load; backend connections are blocked."
