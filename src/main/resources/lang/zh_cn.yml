    reload: "<#CCFFFF>卸载后重新加载指定插件"
    limit: "<#CCFFFF>权限、协议和连接管理插件建议重启代理更新。"
    summary: "<#CCFFFF>查看、检查和热管理代理插件"
  info:
    count: "<gray>已加载插件：<#CCFFFF><count>"
    directory: "<gray>插件目录：<#CCFFFF><path>"
