# MiniMessage 文本。保留 <player> 等占位符；缩进空格用于模块层级显示。

# 通用文字、标点与版本格式
common:
  prefix: "<bold><#FF6600>[VTB]</bold> "
  separator: "："
  none: "无"
  unknown: "未知"
  "yes": "是"
  "no": "否"
  console: "控制台"
  enabled: "已启用"
  disabled: "已关闭"
  usage: "<#FF6600>用法</#FF6600>  <#CCFFFF><usage>"
  versions:
    range: "<min> 至 <max>"
    allow: "；仅允许 <versions>"
    deny: "；禁止 <versions>"

# 公共命令、基本信息与初始化
main:
  language:
    regenerate: "<yellow>语言文件 <file> 使用旧结构，当前使用随包默认语言。请先备份，再移走该文件并执行 /vtb reload 重新生成；自定义语言可复制新版模板。"
  help:
    title: "<#FF6600>VelocityToolbox 命令"
    info: "<#CCFFFF>插件、代理、版本限制与资源包状态"
    reload: "<#CCFFFF>重载配置、语言、版本限制与资源包"
  info:
    title: "<#FF6600>VelocityToolbox 信息"
    field:
      toolbox-version: "<gray>工具箱版本"
      proxy-version: "<gray>代理版本"
      java-version: "<gray>Java"
    section: "<#FFB366>基本信息"
  reload:
    ok: "<green>已重载配置、语言、版本限制与资源包。"
    fail: "<#FF5555>重载失败，请看代理日志。"
  log:
    started: "<green>VelocityToolbox <version> 已启动。"
    reloaded: "<green><source> 已重载配置、语言、版本限制与资源包。"
    reload-failed: "配置或资源包重载失败 / Configuration or resource pack reload failed."

# 插件管理：帮助、检查、操作结果与日志
