# MiniMessage text. Keep placeholders such as <player>; leading spaces align module details.

# Shared text, punctuation and version formatting
common:
  prefix: "<bold><#FF6600>[VTB]</bold> "
  separator: ": "
  none: "none"
  unknown: "unknown"
  "yes": "yes"
  "no": "no"
  console: "console"
  enabled: "enabled"
  disabled: "disabled"
  usage: "<#FF6600>Usage</#FF6600>  <#CCFFFF><usage>"
  versions:
    range: "<min> to <max>"
    allow: "; allowed: <versions>"
    deny: "; excluded: <versions>"

# General commands and startup
main:
  language:
    regenerate: "<yellow>Language file <file> uses an old format. Bundled text is active. Back up and move the file, then run /vtb reload to generate a fresh copy. For custom languages, copy the new template."
  help:
    title: "<#FF6600>VelocityToolbox commands"
    info: "<#CCFFFF>Show plugin, proxy, version rule and resource pack status"
    reload: "<#CCFFFF>Reload configuration, language, version rules and resource packs"
  info:
    title: "<#FF6600>VelocityToolbox status"
    field:
      toolbox-version: "<gray>Toolbox version"
      proxy-version: "<gray>Proxy version"
      java-version: "<gray>Java"
    section: "<#FFB366>General"
  reload:
    ok: "<green>Configuration, language, version rules and resource packs reloaded."
    fail: "<#FF5555>Reload failed. Check the proxy log."
  log:
    started: "<green>VelocityToolbox <version> started."
    reloaded: "<green><source> reloaded configuration, language, version rules and resource packs."
    reload-failed: "Configuration or resource pack reload failed."

# Plugin management
plugin:
  title: "<#FFB366>Plugin management"
  help:
    list: "<#CCFFFF>List plugins, versions and authors; hover for details"
    inspect: "<#CCFFFF>Check dependencies and resources before unloading"
    load: "<#CCFFFF>Load a JAR from plugins/"
    unload: "<#CCFFFF>Unload a plugin and clean up its resources"
    reload: "<#CCFFFF>Unload a plugin, then load it again"
    limit: "<#CCFFFF>Restart the proxy to update permission, protocol or connection plugins."
    summary: "<#CCFFFF>List, inspect and manage proxy plugins"
  info:
    count: "<gray>Loaded plugins: <#CCFFFF><count>"
    directory: "<gray>Plugin directory: <#CCFFFF><path>"
  list:
    title: "<#FF6600>Loaded plugins: <#CCFFFF><count>"
    hover: "<gray>Click to fill in /vtoolbox plugin inspect"
  inspect:
    title: "<#FF6600>Plugin inspection"
    section:
      basic: "<#FFB366>Basic information"
      dependencies: "<#FFB366>Dependencies"
      runtime: "<#FFB366>Runtime resources"
      risk: "<#FFB366>Unload risk"
    risk:
      low: "low"
      medium: "medium"
      high: "high"
      blocked: "unload blocked"
    field:
      id: "<gray>ID"
      name: "<gray>Name"
      version: "<gray>Version"
      authors: "<gray>Authors"
      description: "<gray>Description"
      url: "<gray>Website"
      jar: "<gray>Source JAR"
      instance-class: "<gray>Instance class"
      source-state: "<gray>JAR available"
      instance-state: "<gray>Instance available"
      required-dependencies: "<gray>Required dependencies"
      optional-dependencies: "<gray>Optional dependencies"
      dependents: "<gray>Required by"
      provided-ids: "<gray>Provided plugin IDs"
      commands: "<gray>Commands"
      tasks: "<gray>Scheduled tasks"
      listeners: "<gray>Listeners"
      channels: "<gray>Channels"
      executor: "<gray>Plugin executor"
      risk: "<gray>Risk"
    not-loaded: "<#FF5555>Plugin '<plugin>' is not loaded."
    issue:
      not-loaded: "<#FF5555>The target is not loaded."
      protected: "<#FF5555>Velocity and VelocityToolbox are protected and cannot be unloaded."
      required-by-others: "<#FF5555>Other loaded plugins depend on this plugin; unload is blocked."
      no-source-jar: "<#FF9955>The JAR is missing. Reloading the plugin may fail after it is unloaded."
      no-instance: "<#FF9955>The plugin instance is unavailable; shutdown and cleanup may be incomplete."
      provided-ids: "<#FFFF55>The plugin provides additional IDs; their dependencies must also be checked."
      custom-channels: "<#FFFF55>Custom plugin channels were found. Ownership cannot be determined for channels that use shared API identifiers."
      executor: "<#FFFF55>The existing plugin executor will be shut down during unload."
      standard-cleanup-only: "<#CCFFFF>Registered resources can be removed. Resources created directly by the plugin still need checking."
  load:
    need-jar: "<#FF5555>Specify a .jar filename in <dir>."
    missing-file: "<#FF5555>Plugin JAR not found: <file>"
    protected: "<#FF5555>Refusing to load protected plugin '<plugin>'."
    already: "<#FF5555>Plugin '<plugin>' is already loaded."
    id-taken: "<#FF5555>Plugin ID '<plugin>' is already taken."
    missing-dep: "<#FF5555>Plugin <plugin> is missing dependency '<dependency>'."
    ok: "<green>Loaded plugin <plugin>."
    fail: "<#FF5555>Load failed."
  unload:
    protected: "<#FF5555>Refusing to unload protected plugin '<plugin>'."
    not-loaded: "<#FF5555>Plugin '<plugin>' is not loaded."
    depended: "<#FF5555>These plugins still require '<plugin>': <dependents>"
    ok: "<green>Unloaded plugin <plugin>."
    fail: "<#FF5555>Unload failed."
  reload:
    no-jar: "<#FF5555>No JAR path is available for '<plugin>'; it cannot be reloaded."
    load-failed: "<#FF5555>'<plugin>' was unloaded, but could not be loaded again."
    ok: "<green>Reloaded plugin <plugin>."
  cleanup:
    summary: "<#CCFFFF>Removed: <commands> commands, <tasks> tasks, <listeners> additional listeners and <channels> channels."
  leftover:
    still-loaded: "<#FF5555>'<plugin>' is still registered after unload. Check the log and restart the proxy."
    commands: "<#FF5555>Commands still registered: <detail>"
    listeners: "<#FF5555>Listeners still registered: <count>. Check the proxy log."
  shutdown-error: "<#FF5555>Plugin shutdown failed; cleanup continued."
  error:
    detail: "<#FF5555><type>: <message>"
    see-log: "<#CCFFFF>See the proxy log for the full exception."
  log:
    plugin-loaded: "<green>Loaded plugin <plugin> <version>."
    plugin-loaded-file: "<gray>Source: <aqua><file>"
    plugin-unloaded: "<green>Unloaded plugin <plugin>."
    commands-unregistered: "<aqua>Removed <count> commands for plugin <plugin>."
    leftover-handlers: "<yellow>Removed <count> leftover listeners belonging to plugin <plugin>."
    leftover-channels: "<yellow>Removed <count> message channels identified by plugin <plugin>'s class loader."
    list-failed: "Could not list plugin JARs in <dir>."
    load-failed: "Could not load plugin <file>."
    unload-failed: "Could not unload plugin <plugin>."
    rollback-failed: "Could not clean up after the failed load of <file>."
    cleanup:
      events: "Could not unregister event listeners for plugin <plugin>."
      tasks: "Could not cancel scheduled tasks for the plugin."
      executor: "Could not shut down the executor for plugin <plugin>."
      classloader: "Could not close the plugin class loader."

# Backends and player connections
server:
  title: "<#FFB366>Servers and connections"
  help:
    hosts: "<#CCFFFF>Group players by the address they used to join"
    summary: "<#CCFFFF>View backends and player connection addresses"
  info:
    players: "<gray>Online players: <#CCFFFF><count>"
  hosts:
    title: "<#FF6600>Connection addresses: <#CCFFFF><entries> / <players> players online"
    entry: "  <gray>Domain</gray>: <aqua><domain></aqua>  <gray>Players</gray>: <green><count></green>  <gray>Port</gray>: <aqua><port></aqua>"
    expand-hint: "<gray>Click to show players using this address</gray>"
    collapse-hint: "<gray>Click to hide the player list</gray>"
    player: "    <#FFB366><name></#FFB366>  <gray>Ping</gray>: <#CCFFFF><ping>"
    player-hover-title: "<#FFB366>Player details: <name>"
    player-uuid: "UUID"
    player-ip: "Connection IP"
    player-server: "Current backend"
    player-mode: "Authentication mode"
    invalid-entry: "<#FF5555>No connection address is listed at index <index>."
    empty: "<#FF6600>No players online."
  player:
    online-mode: "online-mode authentication"
    offline-mode: "offline mode"
  versions:
    status:
      enabled: "<green>Server version rules: enabled for <count> servers"
      rule: "    <aqua><server></aqua><gray>: <requirement>"
      disabled: "<gray>Server version rules: disabled"
      failed: "<red>Server version rules: configuration failed; all server connections are blocked"
    denied: "<red>Cannot join <server>.<newline><yellow>Version requirements: <requirement><newline><gray>Your client: <version>."
    protocol-details: "<gray>Protocol requirements: <requirement>"
    client-protocol: "<gray>Client protocol: <protocol>"
    unavailable: "<red>Server version rules could not be loaded. Contact an administrator."
    log:
      load-failed: "Version rules failed to load; backend connections are blocked. Fix config.yml and reload, or disable server-versions."
      reload-failed: "Version rules failed to reload. Previous rules remain active; connections are blocked if no valid rules exist."
      unknown-server: "Backend <server> in the version rules is not registered. Check its name in velocity.toml. The rule takes effect once the backend is registered."

# Resource packs: hosting and delivery
pack:
  title: "<#FFB366>Resource packs"
  help:
    summary: "<#CCFFFF>Host packs, send download requests and track player loading"
    list: "<#CCFFFF>List configured packs and hosted files"
    status: "<#CCFFFF>Show a player's pack status"
    resend: "<#CCFFFF>Send a new pack request for the player's current backend"
  info:
    count: "<gray>Configured packs: <#CCFFFF><count>"
    load-failed: "<yellow>The last pack configuration load failed. Current status is shown below."
  source:
    none: "no resource pack"
    local: "self-hosted"
    external: "external URL"
  label:
    permission: "; permission: <permission>"
    required: "required"
    optional: "optional"
  list:
    variant: "    <#CCFFFF><pack> <gray>· <state> · <required> · <source><newline>      <url><newline>      <conditions>"
  host:
    disabled: "    <gray>disabled"
    files-title: "    <gray>Hosted files: <#CCFFFF><count>"
    log:
      traffic: "<yellow>Pack request summary: <detail>"
      warn-localhost: "<yellow>pack-host.public-url uses localhost. Only clients on the proxy machine can download these packs."
      warn-wildcard: "<yellow>0.0.0.0 is not a download address. Set pack-host.public-url to an IP or domain players can reach."
      warn-fallback: "<yellow>No local IPv4 address was found. Using <origin>; set public-url for players on other machines."
      multiple-addresses: "<yellow>Found multiple local addresses: <addresses>. Using <selected>."
      traffic-detail: "rate-limited requests: <limited>, busy responses: <busy>, timed-out transfers: <timeouts>"
    stats: "    <gray>HTTP: <detail>"
    file: "    <#CCFFFF><file><newline>      <gray><url><newline>      SHA-1: <sha1>"
    title: "<#FFB366>  HTTP hosting"
    status: "<gray>HTTP hosting: <#CCFFFF><state>"
    count: "<gray>Hosted files: <#CCFFFF><count>"
    url: "<gray>Download address: <#CCFFFF><url>"
    directory: "<gray>File directory: <#CCFFFF><path>"
    stats-detail: "active downloads: <downloads>, tracked IPs: <clients>, rate-limited requests: <limited>, busy responses: <busy>, bytes sent: <bytes>"
  delivery:
    retry: "<yellow>The download service is busy. Retry <attempt> is scheduled."
    resend-empty: "<#CCFFFF>No packs match this player's server, version and permissions. Nothing to send."
    unavailable: "<#FF6600>Pack delivery is disabled, or the player has not joined a backend."
    offline: "<#FF5555>That player is not online."
    resent: "<green>A new pack request is scheduled for the player's current backend."
    no-state: "<#CCFFFF>No pack status is available for <player> yet."
    player-title: "<#FF6600>Resource packs for <player> <gray>· <server>"
    backend: "<#CCFFFF>This older client is using the backend's pack. VTB will choose packs again on the next switch or manual resend."
    waiting: "<#CCFFFF>Waiting to send the pack request."
    empty: "<gray>There are no active VTB pack requests."
    item: "<#CCFFFF><pack> <gray>· <state> · <required>"
    skipped: "<#FF6600>No variant matches the client version and permissions for: <packs>"
    failure: "<#FF5555>Resource pack <pack>: <reason>"
    state:
      busy: "download service busy"
      ready: "ready"
      waiting: "waiting for client"
      accepted: "accepted, downloading"
      downloaded: "downloaded, waiting to load"
      loaded: "loaded"
      failed: "failed to load"
      declined: "declined"
      timeout: "timed out"
      unavailable: "unavailable"
    status: "<gray>Pack delivery: <#CCFFFF><state>"
  log:
    load-failed: "Resource pack initialization failed."
  explain:
    title: "<#FFB366>Current rule matches (recalculated on resend)"
    assignment: "<gray>Assignment: <path>"
    empty: "<gray>This assignment is empty; no packs are sent."
    variant: "<#CCFFFF><pack> variant <index> <gray>· <reason><newline>  <conditions>"
    legacy: "<gray>Older clients use only the first matching complete pack in the assignment."
    reason:
      selected: "selected"
      none: "matched @; sends nothing"
      version: "client version does not match"
      permission: "missing required permission"
      version-permission: "version does not match and permission is missing"
