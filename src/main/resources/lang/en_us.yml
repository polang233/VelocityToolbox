prefix: "<bold><#FF6600>[VTB]</bold> "

command:
  help:
    title: "<#FF6600>VelocityToolbox commands"
    info: "<#CCFFFF>plugin, proxy, Java, and pack-host summary"
    packs: "<#CCFFFF>URL and SHA-1 for each zip"
    vhosts: "<#CCFFFF>group players by entry domain/IP and show player details"
    reload: "<#CCFFFF>reload language, config, and pack hosting"
    plugin: "<#CCFFFF>plugin management (list / inspect / load / unload / reload)"
  plugin:
    title: "<#FF6600>Plugin management"
    list: "<#CCFFFF>list plugin name, version, and authors; hover for details"
    inspect: "<#CCFFFF>read-only hot-unload risk and runtime resource check"
    load: "<#CCFFFF>load from plugins/"
    unload: "<#CCFFFF>unload"
    reload: "<#CCFFFF>unload then load"
    limit: "<#CCFFFF>Simple plugins usually unload cleanly. Do not hot-unload large plugins such as LuckPerms, protocol/packet hooks, permission providers, or anything that holds player connections. Restart the proxy if anything looks wrong."
    list-title: "<#FF6600>Loaded plugins: <#CCFFFF><count>"
    inspect-title: "<#FF6600>Plugin inspection"
    hover-hint: "<gray>Click to suggest /vtoolbox plugin inspect"
    section:
      basic: "<#FFB366>Basic information"
      dependencies: "<#FFB366>Dependencies"
      runtime: "<#FFB366>Runtime resources"
      risk: "<#FFB366>Risk conclusion"
    risk:
      low: "low"
      medium: "medium"
      high: "high"
      blocked: "blocked"
  info:
    title: "<#FF6600>VelocityToolbox information"
  common:
    none: "none"
    unknown: "unknown"
    yes: "yes"
    no: "no"
    console: "console"
  player:
    online-mode: "online mode"
    offline-mode: "offline mode"
  field:
    toolbox-version: "<gray>Toolbox version"
    proxy-version: "<gray>Proxy version"
    java-version: "<gray>Java"
    loaded-plugins: "<gray>Loaded plugins"
    pack-host: "<gray>Pack hosting"
    pack-origin: "<gray>Download origin"
    pack-directory: "<gray>Pack directory"
    hosted-packs: "<gray>Hosted packs"
    id: "<gray>ID"
    name: "<gray>Name"
    version: "<gray>Version"
    authors: "<gray>Authors"
    description: "<gray>Description"
    url: "<gray>Website"
    jar: "<gray>Source JAR"
    instance-class: "<gray>Instance class"
    source-state: "<gray>Source available"
    instance-state: "<gray>Instance available"
    required-dependencies: "<gray>Required dependencies"
    optional-dependencies: "<gray>Optional dependencies"
    dependents: "<gray>Required by"
    provided-ids: "<gray>Provided IDs"
    commands: "<gray>Commands"
    tasks: "<gray>Tasks"
    listeners: "<gray>Listeners"
    channels: "<gray>Channels"
    executor: "<gray>Container executor"
    risk: "<gray>Risk"
  usage: "<#FF6600>Usage</#FF6600>  <#CCFFFF><usage>"
  packs:
    disabled: "<#FF6600>Pack hosting is disabled."
    empty: "<#FF6600>No zip files in <#CCFFFF><path>"
    title: "<#FF6600>Packs: <#CCFFFF><count>"
  vhosts:
    title: "<#FF6600>Entry summary: <#CCFFFF><entries> entries / <players> players"
    entry: "<#FFB366>Entry <index></#FFB366>  <gray>domain</gray> <aqua><domain></aqua>  <gray>IP</gray> <aqua><ip></aqua>  <gray>port</gray> <aqua><port></aqua>  <gray>players</gray> <green><count></green>"
    player: "  <#FFB366><name></#FFB366>  <gray>UUID</gray> <#CCFFFF><uuid>  <gray>source IP</gray> <#CCFFFF><ip>  <gray>ping</gray> <#CCFFFF><ping>  <gray>backend</gray> <#CCFFFF><server>  <gray>mode</gray> <#CCFFFF><mode>"
    empty: "<#FF6600>No players online."
  pack-host:
    enabled: "<green>on"
    disabled: "<red>off"
  reload:
    ok: "<green>Reloaded language, config, and pack hosting."
    fail: "<#FF5555>Reload failed. Check the proxy log."

plugins:
  inspect:
    not-loaded: "<#FF5555>Plugin '<plugin>' is not loaded."
    issue:
      not_loaded: "<#FF5555>The target is not loaded."
      protected: "<#FF5555>Velocity and VelocityToolbox are protected targets."
      required_by_others: "<#FF5555>Other loaded plugins require this target, so the real unload will be refused."
      no_source_jar: "<#FF9955>The source JAR is unavailable, so the plugin cannot be reliably loaded again."
      no_instance: "<#FF9955>The plugin has no available instance; lifecycle and ownership cleanup may be incomplete."
      provided_ids: "<#FFFF55>The plugin declares provided IDs, making dependency ownership more complex."
      custom_channels: "<#FFFF55>Custom channel identifiers from this class loader were found; API-standard channel ownership cannot be determined reliably."
      executor: "<#FFFF55>The plugin container executor exists and will receive shutdownNow during unload."
      standard_cleanup_only: "<#CCFFFF>Only tracked standard resources were found. This is a read-only snapshot, not a safety guarantee."
  load:
    need-jar: "<#FF5555>Need a .jar file name inside <dir>"
    missing-file: "<#FF5555>Plugin JAR not found: <file>"
    protected: "<#FF5555>Refusing to load protected plugin '<plugin>'."
    already: "<#FF5555>Plugin '<plugin>' is already loaded."
    id-taken: "<#FF5555>Plugin ID '<plugin>' is already taken."
    missing-dep: "<#FF5555>Plugin <plugin> is missing dependency '<dependency>'"
    ok: "<green>Loaded plugin <plugin>."
    fail: "<#FF5555>Load failed."
  unload:
    protected: "<#FF5555>Refusing to unload protected plugin '<plugin>'."
    not-loaded: "<#FF5555>Plugin '<plugin>' is not loaded."
    depended: "<#FF5555>Plugin '<plugin>' is still required by: <dependents>"
    ok: "<green>Unloaded plugin <plugin>."
    fail: "<#FF5555>Unload failed."
  reload:
    no-jar: "<#FF5555>Plugin '<plugin>' has no JAR path, cannot reload."
    load-failed: "<#FF5555>Unloaded '<plugin>', but loading it again failed."
    ok: "<green>Reloaded plugin <plugin>."
  cleanup:
    summary: "<#CCFFFF>Cleanup: commands <commands>, tasks <tasks>, extra listeners <listeners>, channels <channels>."
  leftover:
    still-loaded: "<#FF5555>'<plugin>' is still in PluginManager after unload. Check the log and consider a full restart."
    commands: "<#FF5555>Commands still registered: <detail>"
    listeners: "<#FF5555><count> event listener(s) still registered. Check the proxy log."
  shutdown-error: "<#FF5555>The plugin's shutdown event threw. Unload cleanup continued anyway."
  error:
    detail: "<#FF5555><type>: <message>"
    see-log: "<#CCFFFF>The full stack trace is in the proxy log. Send that exception if you need help."

log:
  console:
    started: "<green>VelocityToolbox <version> started."
    pack-host-enabled: "<green>Pack hosting: enabled"
    pack-host-disabled: "<yellow>Pack hosting: disabled"
    plugins-dir: "<gray>Plugins directory: <aqua><dir>"
    plugin-loaded: "<green>Loaded plugin <plugin> <version>."
    plugin-loaded-file: "<gray>Source: <aqua><file>"
    plugin-unloaded: "<green>Unloaded plugin <plugin>."
    commands-unregistered: "<aqua>Unregistered <count> command(s) for plugin <plugin>."
    leftover-handlers: "<yellow>Removed <count> leftover listener(s) for plugin <plugin> by class loader."
    leftover-channels: "<yellow>Unregistered <count> plugin message channel(s) for plugin <plugin> by class loader."
    reloaded: "<green><source> reloaded configuration, language, and pack hosting."
  bstats-fail: "Could not start bStats."
  pack-fail: "Pack hosting failed to start. Plugin management commands still work."
  reload-fail: "Could not reload language or pack hosting."
  list-jars: "Could not list plugin JARs in <dir>."
  load-fail: "Could not load plugin <file>."
  unload-fail: "Could not unload plugin <plugin>."
  rollback-fail: "Error while rolling back a failed load of <file>."
  pack:
    warn-localhost: "<yellow>pack-host.public-url uses localhost, so only a local client can download packs."
    warn-wildcard: "<yellow>pack-host.public-url cannot use 0.0.0.0; use a player-reachable IP or domain."
    warn-fallback: "<yellow>No LAN IPv4 was found. Using <origin>; set public-url for clients on other machines."
    multiple-addresses: "<yellow>Several LAN addresses were found: <addresses>; currently using <selected>."
    listen: "<green>Pack hosting started on <aqua><bind>:<port>"
    origin: "<gray>Client download origin: <aqua><origin>"
    directory: "<gray>Pack directory: <aqua><path>"
    empty: "<yellow>No resource packs found. Put .zip files in <path>."
    item: "<green>Resource pack: <file>"
    item-sha1: "<gray>  SHA-1: <aqua><sha1>"
    item-url: "<gray>  URL: <aqua><url>"
    snippet: "<gray>VelocityResourcepacks snippet: <aqua><path>"
  cleanup-warn:
    events: "Could not unregister event listeners for plugin <plugin>."
    tasks: "Could not cancel scheduled tasks for the plugin."
    executor: "Could not shut down the executor for plugin <plugin>."
    classloader: "Could not close the plugin class loader."
