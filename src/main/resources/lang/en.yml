prefix: "<bold><#FF6600>[VTB]</bold> "

command:
  help:
    title: "<#FF6600>VelocityToolbox commands"
    version: "<#CCFFFF>version, plugin count, pack-host switch"
    status: "<#CCFFFF>proxy, Java, pack origin, loaded plugins"
    packs: "<#CCFFFF>URL and SHA-1 for each zip"
    reload: "<#CCFFFF>reload language, config, and pack hosting"
    plugin: "<#CCFFFF>plugin management (list / load / unload / reload)"
  plugin:
    title: "<#FF6600>Plugin management"
    list: "<#CCFFFF>list loaded plugins"
    load: "<#CCFFFF>load from plugins/"
    unload: "<#CCFFFF>unload"
    reload: "<#CCFFFF>unload then load"
    limit: "<#CCFFFF>Simple plugins usually unload cleanly. Do not hot-unload large plugins such as LuckPerms, protocol/packet hooks, permission providers, or anything that holds player connections. Restart the proxy if anything looks wrong."
    list-title: "<#FF6600>Loaded plugins: <#CCFFFF><count>"
  usage: "<#FF6600>Usage</#FF6600>  <#CCFFFF><usage>"
  version: "<#FF6600>VelocityToolbox</#FF6600> <#CCFFFF><version>  plugins=<plugins>"
  status:
    proxy: "<#CCFFFF>Proxy <version>  Java <java>  plugins=<plugins>"
    origin: "<#CCFFFF>Download origin <#FF6600><origin>"
    packs-dir: "<#CCFFFF>Pack directory <path>"
  packs:
    disabled: "<#FF6600>Pack hosting is disabled."
    empty: "<#FF6600>No zip files in <#CCFFFF><path>"
    title: "<#FF6600>Packs: <#CCFFFF><count>"
  pack-host:
    on: "<#CCFFFF>on"
    off: "<#FF5555>off"
  reload:
    ok: "<#CCFFFF>Reloaded language, config, and pack hosting."
    fail: "<#FF5555>Reload failed. Check the proxy log."

plugins:
  load:
    need-jar: "<#FF5555>Need a .jar file name inside <dir>"
    missing-file: "<#FF5555>Plugin JAR not found: <file>"
    protected: "<#FF5555>Refusing to load protected plugin '<plugin>'."
    already: "<#FF5555>Plugin '<plugin>' is already loaded."
    id-taken: "<#FF5555>Plugin ID '<plugin>' is already taken."
    missing-dep: "<#FF5555>Plugin <plugin> is missing dependency '<dependency>'"
    ok: "<#CCFFFF>Loaded plugin <plugin>."
    fail: "<#FF5555>Load failed."
  unload:
    protected: "<#FF5555>Refusing to unload protected plugin '<plugin>'."
    not-loaded: "<#FF5555>Plugin '<plugin>' is not loaded."
    depended: "<#FF5555>Plugin '<plugin>' is still required by: <dependents>"
    ok: "<#CCFFFF>Unloaded plugin <plugin>."
    fail: "<#FF5555>Unload failed."
  reload:
    no-jar: "<#FF5555>Plugin '<plugin>' has no JAR path, cannot reload."
    load-failed: "<#FF5555>Unloaded '<plugin>', but loading it again failed."
    ok: "<#CCFFFF>Reloaded plugin <plugin>."
  cleanup:
    summary: "<#CCFFFF>Cleanup: commands <commands>, tasks <tasks>, extra listeners <listeners>, channels <channels>."
  leftover:
    still-loaded: "<#FF5555>'<plugin>' is still in PluginManager after unload. Check the log and consider a full restart."
    commands: "<#FF5555>Commands still registered: <detail>"
    listeners: "<#FF5555><count> event listener(s) still registered. Check the proxy log."
  shutdown-error: "<#FF5555>The plugin's shutdown event threw. Unload cleanup continued anyway."
  error:
    detail: "<#FF5555><type>: <message>"
    see-log: "<#CCFFFF>The full stack trace is in the proxy log. Send that exception if you need help."

log:
  started: "VelocityToolbox <version> started. Pack hosting <packhost>, plugins directory <dir>."
  bstats-fail: "Could not start bStats."
  pack-fail: "Pack hosting failed to start. Plugin management commands still work."
  reload-fail: "Could not reload language or pack hosting."
  list-jars: "Could not list plugin JARs in <dir>."
  loaded: "Loaded plugin <plugin> <version> from <file>."
  unloaded: "Unloaded plugin <plugin>."
  load-fail: "Could not load plugin <file>."
  unload-fail: "Could not unload plugin <plugin>."
  rollback-fail: "Error while rolling back a failed load of <file>."
  commands-unregistered: "Unregistered <count> command(s) for plugin <plugin>."
  cleanup-warn:
    events: "Could not unregister event listeners for plugin <plugin>."
    tasks: "Could not cancel scheduled tasks for the plugin."
    executor: "Could not shut down the executor for plugin <plugin>."
    classloader: "Could not close the plugin class loader."
    leftover-handlers: "Removed <count> leftover listener(s) for plugin <plugin> by class loader."
    leftover-channels: "Unregistered <count> plugin message channel(s) for plugin <plugin> by class loader."
