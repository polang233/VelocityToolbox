plugins {
    id 'java'
}

group = 'io.github.polang233.velocitytoolbox'
version = '1.1.0'
description = 'Runtime plugin inspection and management, virtual-host diagnostics, and optional multi-pack hosting for Velocity 4.0+'

ext {
    pluginId = 'velocitytoolbox'
    pluginName = 'VelocityToolbox'
    pluginUrl = 'https://github.com/polang233/VelocityToolbox'
    pluginAuthor = 'Polang'
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:4.1.0-SNAPSHOT'
    annotationProcessor 'com.velocitypowered:velocity-api:4.1.0-SNAPSHOT'
    compileOnly 'org.spongepowered:configurate-yaml:4.2.0'
    compileOnly 'com.google.inject:guice:7.0.0'
    compileOnly 'net.kyori:adventure-text-minimessage:4.21.0'
    compileOnly 'net.kyori:adventure-text-serializer-plain:4.21.0'
}

configurations {
    testCompileOnly.extendsFrom compileOnly
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('jar', Jar) {
    archiveBaseName = pluginName
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into 'META-INF'
    }
    manifest {
        attributes(
                'Implementation-Title': pluginName,
                'Implementation-Version': version
        )
    }
}

def packSnippetSmokeTest = tasks.register('packSnippetSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Verifies generated multi-pack VelocityResourcepacks snippets.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.polang233.velocitytoolbox.pack.PackSnippetWriterSmokeTest'
}

def languageResourceSmokeTest = tasks.register('languageResourceSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Verifies bundled language keys and old user-file fallback behavior.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + configurations.compileClasspath
    mainClass = 'io.github.polang233.velocitytoolbox.lang.LanguageResourceSmokeTest'
}

tasks.named('check') {
    dependsOn packSnippetSmokeTest
    dependsOn languageResourceSmokeTest
}

tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}

def generateTemplates = tasks.register('generateTemplates', Copy) {
    def props = [
            version      : project.version,
            description  : project.description,
            pluginId     : pluginId,
            pluginName   : pluginName,
            pluginUrl    : pluginUrl,
            pluginAuthor : pluginAuthor
    ]
    inputs.properties props
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/templates')
    filteringCharset = 'UTF-8'
    expand props
}

sourceSets.main.java.srcDir(generateTemplates.map { it.outputs })
